server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA: cualquier ruta cae en index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # index.html nunca se guarda sin preguntar: sin esto el navegador lo cachea
  # por su cuenta y, al entrar, muestra la versión anterior hasta recargar.
  # Las rutas del SPA caen acá por el try_files de arriba.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # cache largo para assets con hash
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
